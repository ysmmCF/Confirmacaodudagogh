<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071735">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Confirme sua presença e informe seu nome completo.">
  <title>Confirme sua presença</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/confirmar.css">
  <script src="js/api.js" defer></script>
  <script src="js/confirmar.js" defer></script>
</head>
<body class="starry-background">
  <main class="page-shell">
    <header class="intro">
      <h1>Confirme sua presença</h1>
      <p class="intro-copy" id="intro-copy">Responda abaixo se você poderá comparecer e informe seu nome completo.</p>
    </header>

    <section id="state-panel" class="state-panel" aria-live="polite" aria-atomic="true">
      <div class="loading-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <p>Preparando sua noite...</p>
    </section>

    <section id="guest-content" class="guest-content" hidden>
      <form id="rsvp-form">
        <div id="guest-list" class="guest-list"></div>
        <div class="form-footer">
          <p id="form-note" class="form-note">Escolha uma resposta e informe o nome completo de cada pessoa antes de salvar.</p>
          <button id="save-button" class="save-button" type="submit">Salvar confirmação</button>
        </div>
      </form>
    </section>

    <footer class="page-footer"><span>Com carinho, esperamos celebrar com você</span></footer>
  </main>
</body>
</html>
